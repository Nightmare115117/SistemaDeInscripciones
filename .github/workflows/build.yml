name: Build and Deploy API

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Convertir owner a minúsculas
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/mi-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          BUILDKIT_PROGRESS: plain

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy a k3s
        env:
          SERVER_IP: ${{ vars.SSH_SERVER_IP }}
          SERVER_USER: ${{ vars.SSH_USER }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_IP" \
            "kubectl apply -f /home/$SERVER_USER/kubernetes/mi_api.yaml && \
            kubectl set image deployment/mi-api \
            mi-api=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mi-api:latest && \
            kubectl rollout status deployment/mi-api --timeout=120s"